<svg xmlns="http://www.w3.org/2000/svg" viewBox="150 130 680 710" width="980" height="980" role="img" aria-label="Alexis Réparation">


  <!-- Traînées de vitesse -->
  <g fill="#E1FF6E">
    <polygon points="215,330 393,322 393,330"/>
    <polygon points="587,330 765,322 587,338" transform="translate(0 0)"/>
  </g>

  <!-- Téléphone en ligne -->
  <g fill="none" stroke="#E1FF6E" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <rect x="395" y="170" width="190" height="300" rx="38"/>
    <path d="M 465,194 L 515,194" stroke-width="7"/>
  </g>
  <circle cx="490" cy="448" r="6" fill="#E1FF6E"/>

  <!-- Le « A » d'Alexis avec un battement de cœur en guise de barre -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="430,410 490,228 550,410" stroke="#FFFFFF" stroke-width="13"/>
    <polyline points="451,345 470,345 481,318 495,372 506,345 529,345" stroke="#E1FF6E" stroke-width="7"/>
  </g>

  <!-- Nom -->
  <g font-family="Poppins, Montserrat, 'Century Gothic', Futura, 'Trebuchet MS', Arial, sans-serif" text-anchor="middle">
    <text x="495" y="645" font-size="124" font-weight="800" fill="#FFFFFF" letter-spacing="10">ALEXIS</text>
    <text x="498" y="725" font-size="56" font-weight="300" fill="#E1FF6E" letter-spacing="18">RÉPARATION</text>
    <text x="492" y="800" font-size="26" font-weight="400" fill="#FFFFFF" fill-opacity="0.75" letter-spacing="5">Votre téléphone comme neuf</text>
  </g>
</svg>
